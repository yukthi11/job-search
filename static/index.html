<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobSpy Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="glass-header">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon"></div>
                    <h1>JobSpy Dashboard</h1>
                </div>
                <button id="refresh-btn" class="primary-btn">
                    <svg class="refresh-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg>
                    <span>Refresh Jobs</span>
                </button>
            </div>
            <section class="filter-panel">
                <div class="input-group">
                    <label>Job Title / Keywords</label>
                    <input type="text" id="filter-term" value="software engineer" placeholder="e.g. Data Scientist">
                </div>
                <div class="input-group">
                    <label>Country</label>
                    <select id="filter-country">
                        <option value="UK" selected>United Kingdom</option>
                        <option value="India">India</option>
                        <option value="Ireland">Ireland</option>
                        <option value="USA">United States</option>
                        <option value="Canada">Canada</option>
                        <option value="Germany">Germany</option>
                        <option value="Netherlands">Netherlands</option>
                        <option value="Australia">Australia</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>City / Region (optional)</label>
                    <input type="text" id="filter-location" value="" placeholder="e.g. London - leave empty for the whole country">
                </div>
                <div class="input-group">
                    <label>Posted Within</label>
                    <select id="filter-hours">
                        <option value="24">Last 24 hours</option>
                        <option value="72">Last 3 days</option>
                        <option value="168" selected>Last 7 days</option>
                        <option value="720">Last 30 days</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Results per Site</label>
                    <input type="number" id="filter-results" value="10" min="1" max="1000" style="background: rgba(0, 0, 0, 0.2); border: 1px solid var(--glass-border); border-radius: 8px; padding: 0.75rem 1rem; color: var(--text-primary); font-family: 'Outfit', sans-serif; font-size: 0.95rem;">
                </div>
                <div class="input-group">
                    <label title="Hides jobs that ask for more years than this. Leave empty to show everything.">My Years of Experience</label>
                    <input type="number" id="filter-experience" min="0" max="40" step="1" placeholder="e.g. 2 - empty shows all">
                </div>
                <div class="input-group checkbox-group">
                    <label class="toggle">
                        <input type="checkbox" id="filter-remote" checked>
                        <span class="slider"></span>
                    </label>
                    <span>Remote Only</span>
                </div>
                <div class="input-group checkbox-group">
                    <label class="toggle">
                        <input type="checkbox" id="filter-worldwide" checked>
                        <span class="slider"></span>
                    </label>
                    <span title="Searches only remote job boards and hides jobs tied to one country. Turn off to search a specific country on LinkedIn/Indeed/Glassdoor.">Worldwide remote only</span>
                </div>
                <div class="input-group checkbox-group">
                    <label class="toggle">
                        <input type="checkbox" id="filter-open-hiring" checked>
                        <span class="slider"></span>
                    </label>
                    <span title="Hides jobs whose description says you must be based in, or have the right to work in, a specific country">Hide location-restricted jobs</span>
                </div>
            </section>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" id="tab-search">Search Results</button>
            <button class="tab-btn" id="tab-applied">Applied Jobs <span id="applied-count" class="badge">0</span></button>
        </nav>

        <main>
            <div class="search-container">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" placeholder="Quick filter downloaded jobs by title, company, or site...">
            </div>
            <div id="stats-container" class="stats">
                <p>Loading jobs...</p>
            </div>
            
            <div id="jobs-grid" class="jobs-grid">
                <!-- Job cards will be injected here -->
            </div>

            <div id="applied-grid" class="jobs-grid" style="display: none;">
                <!-- Applied job cards will be injected here -->
            </div>
        </main>
    </div>

    <!-- Company Details Modal -->
    <div id="modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal-card glass-header">
            <div class="modal-header">
                <h2 id="modal-company-name">Company Details</h2>
                <button id="modal-close" class="modal-close-btn">✕</button>
            </div>
            <div id="modal-body" class="modal-body">
                <div class="modal-loading">
                    <div class="spinner"></div>
                    <p>Searching company website...</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/app.js"></script>
</body>
</html>
